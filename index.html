<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Flappy Coq — un jeu d'arcade où l'on fait voler le coq entre les tuyaux.">
<title>Flappy Coq</title>
<meta name="apple-mobile-web-app-title" content="Flappy Coq">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* ===== FLAPPY COQ — styles =====
   --u = 1/720e de la hauteur du jeu (défini en JS) : toute l'interface suit l'échelle du canvas. */
:root {
  --u: 1px;
  --ink: #3b2414;
  --orange: #f06a2c;
  --orange-d: #b9431a;
  --cream: #fff4d6;
  --cream-d: #e9cf95;
  --green: #6cc63b;
  --font-title: "Lilita One", "Arial Black", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-ui: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  overscroll-behavior: none;
  background: #4ec0f0;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  font-family: var(--font-ui);
}
body { position: relative; width: 100%; }
html.standalone, html.standalone body { height: 100vh; }

#app {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, #2a4a8a 0, transparent 45%),
    radial-gradient(circle at 80% 85%, #1d6b6a 0, transparent 40%),
    #14213d;
}

#stage {
  position: relative;
  height: 100%;
  width: min(100%, calc(100dvh * 0.62));
  overflow: hidden;
  touch-action: none;
  background: #4ec0f0;
  box-shadow: 0 0 60px rgba(0,0,0,.45);
  cursor: pointer;
}
@supports not (height: 100dvh) { #stage { width: min(100%, calc(100vh * 0.62)); } }

#game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* ---------- Texte détouré façon arcade ---------- */
.stroke-text {
  font-family: var(--font-title);
  color: #fff;
  -webkit-text-stroke: calc(var(--u) * 7) var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 calc(var(--u) * 5) 0 rgba(59,36,20,.55);
  letter-spacing: .02em;
  line-height: 1;
}

/* ---------- Écrans ---------- */
.screen {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .25s ease, visibility 0s linear .25s;
}
.screen.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .25s ease; }
.screen.dim { background: rgba(15, 25, 55, .55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.screen > * { position: absolute; left: 50%; transform: translateX(-50%); }

/* ---------- Boutons ---------- */
button { font: inherit; border: 0; padding: 0; background: none; color: inherit; cursor: pointer; touch-action: manipulation; }

.btn {
  font-family: var(--font-title);
  font-size: calc(var(--u) * 30);
  color: #fff;
  min-width: calc(var(--u) * 210);
  padding: calc(var(--u) * 12) calc(var(--u) * 26) calc(var(--u) * 14);
  border-radius: calc(var(--u) * 16);
  border: calc(var(--u) * 4) solid var(--ink);
  -webkit-text-stroke: calc(var(--u) * 5) var(--ink);
  paint-order: stroke fill;
  letter-spacing: .03em;
  white-space: nowrap;
  transition: transform .08s ease, box-shadow .08s ease, filter .15s;
}
.btn-primary {
  background: linear-gradient(#ff9a4d, var(--orange) 55%, #e2551e);
  box-shadow: inset 0 calc(var(--u)*4) 0 rgba(255,255,255,.35), 0 calc(var(--u)*7) 0 var(--orange-d), 0 calc(var(--u)*10) 0 rgba(59,36,20,.35);
}
.btn-secondary {
  background: linear-gradient(#fffaf0, var(--cream) 60%, #f3dfae);
  color: var(--ink);
  -webkit-text-stroke: 0;
  font-size: calc(var(--u) * 21);
  box-shadow: inset 0 calc(var(--u)*3) 0 #fff, 0 calc(var(--u)*6) 0 #b99556, 0 calc(var(--u)*9) 0 rgba(59,36,20,.3);
}
.btn-big { font-size: calc(var(--u) * 40); min-width: calc(var(--u) * 240); }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateX(-50%) translateY(calc(var(--u) * 5)); box-shadow: 0 calc(var(--u)*2) 0 var(--orange-d); }
.btn-row .btn:active, .btn-row .btn-icon:active { transform: translateY(calc(var(--u) * 5)); }
.btn-secondary:active { box-shadow: 0 calc(var(--u)*2) 0 #b99556; }

.icon-btn {
  width: calc(var(--u) * 52); height: calc(var(--u) * 52);
  border-radius: calc(var(--u) * 14);
  background: linear-gradient(#fffaf0, var(--cream));
  border: calc(var(--u) * 3.5) solid var(--ink);
  box-shadow: 0 calc(var(--u)*5) 0 #b99556;
  display: grid; place-items: center;
  transition: transform .08s;
}
.icon-btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u)*1) 0 #b99556; }
.icon-btn svg { width: 62%; height: 62%; fill: var(--ink); }

/* ---------- Chargement ---------- */
#loading { background: #4ec0f0; display: block; }
.loader {
  top: 42%; width: calc(var(--u) * 56); height: calc(var(--u) * 56);
  border-radius: 50%;
  border: calc(var(--u) * 7) solid rgba(255,255,255,.35);
  border-top-color: #fff;
  animation: spin .8s linear infinite;
}
#loadingText { top: 52%; margin: 0; width: 86%; text-align: center; color: #fff; font-weight: 900; font-size: calc(var(--u) * 20); text-shadow: 0 2px 0 rgba(0,0,0,.2); line-height: 1.4; }
#loading.error .loader { display: none; }
#loading.error #loadingText { top: 35%; background: rgba(59,36,20,.85); padding: calc(var(--u)*18); border-radius: calc(var(--u)*14); font-size: calc(var(--u) * 17); }
@keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

/* ---------- Accueil ---------- */
.top-bar { top: calc(var(--u) * 18 + env(safe-area-inset-top, 0px)); width: calc(100% - var(--u) * 36); display: flex; justify-content: space-between; }
.title {
  top: calc(10.5% + env(safe-area-inset-top, 0px) * .6); margin: 0;
  display: flex; flex-direction: column; align-items: center;
  font-weight: 400; white-space: nowrap;
  font-size: min(calc(var(--u) * 80), 19vw);
  animation: wobble 2.6s ease-in-out infinite;
}
.title span:first-child { font-size: .78em; color: #ffe066; }
.title span:last-child { margin-top: -.06em; color: #fff; }
@keyframes wobble {
  0%, 100% { transform: translateX(-50%) rotate(-2.5deg) scale(1); }
  50% { transform: translateX(-50%) rotate(2.5deg) scale(1.04); }
}
.best-pill {
  top: calc(30% + env(safe-area-inset-top, 0px) * .6);
  display: flex; align-items: center; gap: calc(var(--u)*8);
  white-space: nowrap;
  padding: calc(var(--u)*7) calc(var(--u)*18);
  border-radius: 999px;
  background: rgba(59,36,20,.78);
  color: #fff; font-weight: 800; font-size: calc(var(--u) * 19);
  border: calc(var(--u)*3) solid rgba(255,255,255,.85);
}
.best-pill b { color: #ffd84d; font-size: 1.15em; }
.trophy { width: 1.2em; height: 1.2em; fill: #ffd84d; }
#btnPlay { top: 60%; animation: pulse 1.6s ease-in-out infinite; }
#btnPlay:active { animation: none; }
@keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
.hint {
  top: 73%; margin: 0; width: 90%; text-align: center;
  color: #fff; font-weight: 900; font-size: calc(var(--u) * 18);
  text-shadow: 0 calc(var(--u)*2) 0 var(--ink), 0 0 calc(var(--u)*6) rgba(59,36,20,.6);
}

/* ---------- Prêt ---------- */
.ready-title { top: 21%; white-space: nowrap; font-size: calc(var(--u) * 66); color: #ffe066; }
.tap { top: 58%; width: calc(var(--u)*70); height: calc(var(--u)*70); }
.tap-hand { position: absolute; inset: 0; width: 100%; height: 100%; animation: tap 1s ease-in-out infinite; transform-origin: 40% 20%; z-index: 1; }
.tap-ring {
  position: absolute; left: 16%; top: -14%; width: calc(var(--u)*34); height: calc(var(--u)*34);
  border-radius: 50%; border: calc(var(--u)*4) solid #fff; opacity: 0;
  animation: ring 1s ease-out infinite;
}
@keyframes tap { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(calc(var(--u)*-6)) scale(.94); } }
@keyframes ring { 0%, 35% { transform: scale(.4); opacity: 0; } 45% { opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.ready-hint { top: 70%; margin: 0; width: 90%; text-align: center; color: #fff; font-weight: 900; font-size: calc(var(--u)*18); text-shadow: 0 calc(var(--u)*2) 0 var(--ink); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; }
#hud.hidden { opacity: 0; }
#hud.hidden .hud-btn { pointer-events: none; }
#score {
  position: absolute; top: calc(7% + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  font-size: calc(var(--u) * 78);
  -webkit-text-stroke-width: calc(var(--u) * 8);
}
#score.bump { animation: bump .28s ease-out; }
@keyframes bump { 0% { transform: translateX(-50%) scale(1); } 35% { transform: translateX(-50%) scale(1.28); color: #ffe066; } 100% { transform: translateX(-50%) scale(1); } }
.hud-btn { position: absolute; top: calc(var(--u)*18 + env(safe-area-inset-top, 0px)); right: calc(var(--u)*18); pointer-events: auto; }

/* ---------- Compte à rebours ---------- */
#countNum { top: 36%; font-size: calc(var(--u) * 120); color: #ffe066; }
#countNum.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: translateX(-50%) scale(1.8); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateX(-50%) scale(1); } }

/* ---------- Pause ---------- */
.panel-title { top: calc(20% + env(safe-area-inset-top, 0px) * .5); font-size: calc(var(--u) * 72); }
#btnResume { top: 40%; }
#btnPauseHome { top: 53%; }
.toggle-row { top: 66%; display: flex; gap: calc(var(--u)*18); }

/* ---------- Game over ---------- */
.over-title { top: calc(9% + env(safe-area-inset-top, 0px) * .6); font-size: min(calc(var(--u) * 58), 13vw); color: #ffb03b; white-space: nowrap; }
#over.show .over-title { animation: drop .55s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes drop { 0% { transform: translateX(-50%) translateY(calc(var(--u)*-60)); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }

.card {
  top: 23%;
  width: calc(var(--u) * 300); max-width: 88%;
  padding: calc(var(--u)*16) calc(var(--u)*18) calc(var(--u)*12);
  display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*6) calc(var(--u)*16);
  background: linear-gradient(#fffaea, var(--cream));
  border: calc(var(--u)*4.5) solid var(--ink);
  border-radius: calc(var(--u) * 20);
  box-shadow: inset 0 0 0 calc(var(--u)*4) #f7e3b4, 0 calc(var(--u)*8) 0 rgba(59,36,20,.35);
  color: var(--ink);
}
#over.show .card { animation: rise .5s .15s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes rise { 0% { transform: translateX(-50%) translateY(calc(var(--u)*120)); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }

.lbl { font-weight: 900; font-size: calc(var(--u)*14); letter-spacing: .08em; color: #c0602a; display: flex; align-items: center; gap: calc(var(--u)*6); justify-content: flex-end; }
.medal-box { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*4); }
.medal-box .lbl { justify-content: center; }
#medal { width: calc(var(--u)*92); height: calc(var(--u)*92); }
#medal svg { width: 100%; height: 100%; display: block; }
#medal.won svg { animation: medalIn .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes medalIn { 0% { transform: scale(0) rotate(-120deg); } 100% { transform: scale(1) rotate(0); } }
.medal-name { font-weight: 900; font-size: calc(var(--u)*13); letter-spacing: .06em; }
.scores { text-align: right; }
.num { font-family: var(--font-title); font-size: calc(var(--u)*42); line-height: 1.05; color: #fff; -webkit-text-stroke: calc(var(--u)*5.5) var(--ink); paint-order: stroke fill; }
.badge {
  display: none; position: absolute; top: calc(var(--u)*-14); right: calc(var(--u)*-10);
  transform: rotate(8deg); border: calc(var(--u)*3) solid var(--ink); font-size: calc(var(--u)*13) !important;
  box-shadow: 0 calc(var(--u)*3) 0 rgba(59,36,20,.4);
  background: #e8402a; color: #fff; font-size: calc(var(--u)*10); letter-spacing: .04em;
  padding: calc(var(--u)*2) calc(var(--u)*6); border-radius: calc(var(--u)*6);
  animation: blink .7s steps(2) infinite;
}
.badge.on { display: inline-block; }
@keyframes blink { 50% { opacity: .55; } }
.next-medal { grid-column: 1 / -1; text-align: center; font-weight: 800; font-size: calc(var(--u)*13); color: #8a6a44; border-top: calc(var(--u)*2) dashed #e2c88e; padding-top: calc(var(--u)*8); min-height: 1.2em; }

#btnReplay { top: 59%; min-width: calc(var(--u)*270); }
#over .btn-row { top: 71.5%; display: flex; gap: calc(var(--u)*10); width: calc(var(--u)*300); max-width: 88%; }
#over .btn-row .btn { min-width: 0; }
#btnHome { flex: 1; font-size: calc(var(--u)*17); padding-left: calc(var(--u)*8); padding-right: calc(var(--u)*8); }
#btnReplay { width: calc(var(--u)*300); max-width: 88%; min-width: 0 !important; }
.btn-icon { width: calc(var(--u)*58); padding: 0; display: grid; place-items: center; }
.btn-icon svg { width: calc(var(--u)*28); height: calc(var(--u)*28); fill: var(--ink); }
#over .btn, #over .btn-row { opacity: 0; }
#over.show .btn, #over.show .btn-row { animation: fadeUp .35s .45s ease-out both; }
#over.show .btn-row .btn { animation: none; opacity: 1; }
@keyframes fadeUp { 0% { opacity: 0; margin-top: calc(var(--u)*20); } 100% { opacity: 1; margin-top: 0; } }

/* ---------- Flash & toast ---------- */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

#toast {
  position: absolute; left: 50%; bottom: 17%;
  transform: translateX(-50%) translateY(calc(var(--u)*20));
  background: rgba(59,36,20,.92); color: #fff; font-weight: 800; font-size: calc(var(--u)*16);
  padding: calc(var(--u)*10) calc(var(--u)*18); border-radius: calc(var(--u)*12);
  opacity: 0; pointer-events: none; transition: .25s; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .title, #btnPlay, .tap-hand, .tap-ring, .badge { animation: none !important; }
}

/* ---------- Barre d'onglets ---------- */
#tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  height: calc(var(--u) * 92 + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: stretch; gap: calc(var(--u) * 14);
  padding: 0 calc(var(--u) * 16);
  background: linear-gradient(#ffffff, #eef3fb);
  border-top: calc(var(--u) * 4) solid var(--ink);
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2,1.2,.4,1);
}
#tabbar.show { transform: translateY(0); }
.tab {
  position: relative; flex: 0 1 calc(var(--u) * 132);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: calc(var(--u) * 8 + env(safe-area-inset-bottom, 0px));
  border-radius: calc(var(--u) * 18) calc(var(--u) * 18) 0 0;
  transition: background .2s, transform .15s;
}
.tab-ico { width: calc(var(--u) * 50); height: calc(var(--u) * 50); display: grid; place-items: center; transition: transform .25s cubic-bezier(.2,1.6,.4,1); }
.tab-ico img, .tab-ico svg { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 calc(var(--u)*2) 0 rgba(59,36,20,.35)); }
.tab-lbl {
  font-family: var(--font-title); font-size: calc(var(--u) * 17); color: #fff; letter-spacing: .03em;
  -webkit-text-stroke: calc(var(--u) * 4.5) var(--ink); paint-order: stroke fill; line-height: 1.1;
}
.tab.active {
  margin-top: calc(var(--u) * -18);
  background: linear-gradient(#7cc4ff, #3f8fe6);
  border: calc(var(--u) * 4) solid var(--ink); border-bottom: 0;
  box-shadow: inset 0 calc(var(--u)*4) 0 rgba(255,255,255,.4);
}
.tab.active .tab-ico { transform: translateY(calc(var(--u) * -14)) scale(1.35); }
.tab:not(.active):active { transform: translateY(calc(var(--u) * 3)); }
#menu .hint { top: 74%; }

/* ---------- Écran BIRDS ---------- */
#birds { background: linear-gradient(rgba(42, 95, 190, .82), rgba(30, 70, 160, .9)); }
.birds-title { top: calc(3.5% + env(safe-area-inset-top, 0px)); font-size: calc(var(--u) * 52); }
.collected {
  top: calc(13% + env(safe-area-inset-top, 0px)); white-space: nowrap;
  font-family: var(--font-title); font-size: calc(var(--u) * 19); color: #fff; letter-spacing: .03em;
  -webkit-text-stroke: calc(var(--u) * 4.5) var(--ink); paint-order: stroke fill;
}
.collected b { font-weight: 400; color: #ffd84d; }
.collection {
  top: calc(18.5% + env(safe-area-inset-top, 0px));
  width: calc(var(--u) * 348); max-width: 94%;
  padding: calc(var(--u) * 12) calc(var(--u) * 12) calc(var(--u) * 10);
  background: rgba(24, 48, 110, .78);
  border: calc(var(--u) * 4) solid #16244c;
  border-radius: calc(var(--u) * 22);
  box-shadow: inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.15), 0 calc(var(--u)*6) 0 rgba(10,20,50,.35);
}
.col-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 calc(var(--u)*4) calc(var(--u)*12); }
.col-name { font-family: var(--font-title); font-size: calc(var(--u) * 23); color: #fff; -webkit-text-stroke: calc(var(--u)*4.5) #0e1733; paint-order: stroke fill; letter-spacing: .03em; }
.col-count { font-weight: 900; font-size: calc(var(--u) * 16); color: #ffd84d; font-variant-numeric: tabular-nums; }
.bird-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 12) calc(var(--u) * 8); padding: calc(var(--u) * 14) calc(var(--u) * 4) calc(var(--u) * 6); margin: calc(var(--u) * -10) calc(var(--u) * -4) 0; max-height: calc(var(--u) * 340); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
.bird-grid::-webkit-scrollbar { display: none; }
.bird-card {
  position: relative; aspect-ratio: 0.56;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: calc(var(--u)*6) calc(var(--u)*4) calc(var(--u)*8);
  border-radius: calc(var(--u) * 14);
  border: calc(var(--u) * 3.5) solid #0e1733;
  background: linear-gradient(#5ec3ff, #2f87e0 70%, #2a76c9);
  box-shadow: inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.35), 0 calc(var(--u)*4) 0 rgba(10,20,50,.45);
  color: #fff; text-align: center; min-width: 0;
  transition: transform .1s;
}
button.bird-card:active { transform: scale(.95); }
.bird-card.equipped { outline: calc(var(--u) * 4) solid #fff; outline-offset: calc(var(--u) * 2); }
.bird-card.pop { animation: cardPop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes cardPop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
.eq-tag {
  position: absolute; top: calc(var(--u) * -12); left: 50%; transform: translateX(-50%);
  background: #fff; color: #2f87e0; border: calc(var(--u)*3) solid #0e1733; border-radius: calc(var(--u)*8);
  font-weight: 900; font-size: calc(var(--u) * 10); letter-spacing: .04em; padding: 0 calc(var(--u)*5); white-space: nowrap;
}
.bc-img { flex: 1 1 0; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding-bottom: calc(var(--u) * 3); }
.bc-img img { max-width: 88%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 calc(var(--u)*3) 0 rgba(14,23,51,.4)); }
.bird-card.equipped .bc-img img { animation: idle 1.6s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(calc(var(--u) * -4)) rotate(-3deg); } }
.bc-name { font-family: var(--font-title); font-size: calc(var(--u) * 12.5); line-height: 1.05; letter-spacing: .02em; -webkit-text-stroke: calc(var(--u)*3.5) #0e1733; paint-order: stroke fill; max-width: 100%; overflow-wrap: anywhere; }
.bc-rar { font-weight: 900; font-size: calc(var(--u) * 10.5); color: #dff1ff; }
.bc-stars { font-size: calc(var(--u) * 11); color: rgba(14,23,51,.45); letter-spacing: .08em; line-height: 1; }
.bc-stars .on { color: #ffd84d; -webkit-text-stroke: calc(var(--u)*1) #0e1733; }
.bird-card.locked { background: #22356e; box-shadow: inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.08); }
.lock-q { font-family: var(--font-title); font-size: calc(var(--u) * 46); color: #0e1733; }
.bird-card.locked .bc-rar { color: #9fb2e8; }
.col-hint { margin: calc(var(--u)*12) 0 0; text-align: center; color: #cfe2ff; font-weight: 800; font-size: calc(var(--u) * 13); }
#btnBirdsPlay { top: auto; bottom: calc(var(--u) * 126 + env(safe-area-inset-bottom, 0px)); }

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Zone de jeu Flappy Coq"></canvas>
    <div id="flash"></div>

    <!-- HUD en jeu -->
    <div id="hud" class="hidden">
      <div id="score" class="stroke-text">0</div>
      <button id="btnPause" class="icon-btn hud-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
    </div>

    <!-- Chargement -->
    <div id="loading" class="screen show">
      <div class="loader"></div>
      <p id="loadingText">Chargement…</p>
    </div>

    <!-- Accueil -->
    <div id="menu" class="screen">
      <div class="top-bar">
        <button class="icon-btn js-sound" aria-label="Son"></button>
        <button class="icon-btn js-theme" aria-label="Jour / nuit"></button>
      </div>
      <h1 class="title stroke-text"><span>FLAPPY</span><span>COQ</span></h1>
      <div class="best-pill">
        <svg viewBox="0 0 24 24" class="trophy"><path d="M7 3h10v3h3v2a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V6h3V3zm0 5H6a3 3 0 0 0 1.4 2.5A7 7 0 0 1 7 8zm10 0a7 7 0 0 1-.4 2.5A3 3 0 0 0 18 8h-1z"/></svg>
        Meilleur score : <b id="menuBest">0</b>
      </div>
      <button id="btnPlay" class="btn btn-primary btn-big">JOUER</button>
      <p class="hint">Clique ou touche l'écran pour voler !</p>
    </div>

    <!-- Collection BIRDS -->
    <div id="birds" class="screen">
      <div class="birds-title stroke-text">BIRDS</div>
      <div class="collected"><b id="birdsCount">2 / 3</b> BIRDS COLLECTÉS</div>
      <section class="collection" aria-label="Collection Classiques">
        <div class="col-head">
          <span class="col-name">CLASSIQUES</span>
          <span class="col-count" id="colCount">2 / 3</span>
        </div>
        <div class="bird-grid" id="birdGrid"></div>
        <p class="col-hint">Touche un personnage pour l'équiper</p>
      </section>
      <button id="btnBirdsPlay" class="btn btn-primary">JOUER</button>
    </div>

    <!-- Prêt -->
    <div id="ready" class="screen">
      <div class="ready-title stroke-text">Prêt ?</div>
      <div class="tap">
        <svg viewBox="0 0 64 64" class="tap-hand"><path d="M27 8a5 5 0 0 1 5 5v15.5l2.4-.4a5 5 0 0 1 4.6 1.6l.4.5 2.5-.3a5 5 0 0 1 4.8 2.4l2.3-.1a5 5 0 0 1 5 5V45c0 8-6 14-14 14h-6.6a12 12 0 0 1-9.8-5l-9.3-13a4.8 4.8 0 0 1 7.3-6.2L22 37V13a5 5 0 0 1 5-5z" fill="#fff" stroke="#3b2414" stroke-width="3" stroke-linejoin="round"/></svg>
        <div class="tap-ring"></div>
      </div>
      <p class="ready-hint">Touche, clique ou appuie sur ESPACE</p>
    </div>

    <!-- Compte à rebours de reprise -->
    <div id="countdown" class="screen"><div id="countNum" class="stroke-text">3</div></div>

    <!-- Pause -->
    <div id="pause" class="screen dim">
      <div class="panel-title stroke-text">PAUSE</div>
      <button id="btnResume" class="btn btn-primary">REPRENDRE</button>
      <button id="btnPauseHome" class="btn btn-secondary">RETOUR À L'ACCUEIL</button>
      <div class="toggle-row">
        <button class="icon-btn js-sound" aria-label="Son"></button>
        <button class="icon-btn js-theme" aria-label="Jour / nuit"></button>
      </div>
    </div>

    <!-- Game over -->
    <div id="over" class="screen">
      <div class="over-title stroke-text">GAME OVER</div>
      <div class="card">
        <div class="medal-box">
          <div class="lbl">MÉDAILLE</div>
          <div id="medal"></div>
          <div id="medalName" class="medal-name"></div>
        </div>
        <div class="scores">
          <div class="lbl">SCORE</div>
          <div id="overScore" class="num">0</div>
          <div class="lbl">MEILLEUR</div>
          <div id="overBest" class="num">0</div>
        </div>
        <div id="nextMedal" class="next-medal"></div>
        <span id="newBadge" class="badge">NOUVEAU RECORD !</span>
      </div>
      <button id="btnReplay" class="btn btn-primary">REJOUER</button>
      <div class="btn-row">
        <button id="btnHome" class="btn btn-secondary">RETOUR À L'ACCUEIL</button>
        <button id="btnShare" class="btn btn-secondary btn-icon" aria-label="Partager mon score">
          <svg viewBox="0 0 24 24"><path d="M12 3l4.5 4.5-1.4 1.4L13 6.8V15h-2V6.8L8.9 8.9 7.5 7.5 12 3zM5 13h2v6h10v-6h2v8H5v-8z"/></svg>
        </button>
      </div>
    </div>

    <!-- Barre d'onglets -->
    <nav id="tabbar" aria-label="Navigation">
      <button class="tab" data-tab="birds" aria-label="Birds">
        <span class="tab-ico"><img id="tabBirdImg" alt=""></span>
        <span class="tab-lbl">BIRDS</span>
      </button>
      <button class="tab" data-tab="menu" aria-label="Accueil">
        <span class="tab-ico">
          <svg viewBox="0 0 64 64"><path d="M8 32 32 10l24 22" fill="none" stroke="#3b2414" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 30v24h36V30L32 14z" fill="#ffe7b8" stroke="#3b2414" stroke-width="4" stroke-linejoin="round"/><path d="M8 32 32 10l24 22" fill="none" stroke="#e8402a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="38" width="12" height="16" rx="2" fill="#f06a2c" stroke="#3b2414" stroke-width="3.5"/><rect x="40" y="35" width="7" height="7" rx="1" fill="#7fd0f5" stroke="#3b2414" stroke-width="2.5"/></svg>
        </span>
        <span class="tab-lbl">ACCUEIL</span>
      </button>
    </nav>

    <div id="toast"></div>
  </div>
</div>

<script>
/* ===== FLAPPY COQ — effets sonores générés en Web Audio API (aucun fichier audio) ===== */
window.Sfx = (() => {
  'use strict';
  let ctx = null, master = null, noiseBuf = null, muted = false;
  const VOLUME = 0.55;

  // Crée le contexte audio au premier geste de l'utilisateur (obligatoire sur iOS / Chrome)
  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : VOLUME;
        master.connect(ctx.destination);
        // « Préchargement » : le buffer de bruit est calculé une seule fois
        noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { console.warn('Audio indisponible :', e); ctx = null; return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  function difficulty() { return smooth(clamp(S.score / CFG.rampScore, 0, 1)); }

    const gap = lerp(CFG.gap0, CFG.gap1, d);
    const minY = CFG.topMargin + gap / 2, maxY = GROUND_Y - CFG.bottomMargin - gap / 2;
    const maxDelta = gap * CFG.gapDeltaRatio;
    let y = S.lastGapY + (Math.random() * 2 - 1) * maxDelta;
    y = clamp(y, Math.max(minY, S.lastGapY - maxDelta), Math.min(maxY, S.lastGapY + maxDelta));
    S.lastGapY = y;
    S.pipes.push({ wx: S.nextPipeWX, gapY: y, gap, scored: false });
    S.nextPipeWX += lerp(CFG.space0, CFG.space1, d);
  }

  /* ------------------------------------------------------------------
     COLLISIONS
     ------------------------------------------------------------------ */
  function hitCircles(x, y, rot) {
    const s = cur.w / cur.srcW, c = Math.cos(rot), n = Math.sin(rot);
    return cur.hit.map(([hx, hy, hr]) => {
      const lx = (hx - cur.srcW / 2) * s, ly = (hy - cur.srcH / 2) * s;
      return { x: x + lx * c - ly * n, y: y + lx * n + ly * c, r: hr * s * cur.shrink };
    });
  }
  function circleRect(cx, cy, r, x, y, w, h) {
    const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }
  function pipeRects(p, sx) {
    const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2, o = CFG.capOver, pw = CFG.pipeW;
    return [
      [sx, -400, pw, top - CFG.capH + 400], [sx - o, top - CFG.capH, pw + o * 2, CFG.capH],
      [sx - o, bot, pw + o * 2, CFG.capH], [sx, bot + CFG.capH, pw, GROUND_Y - bot]
    ];
  }
  function bottomExtent(rot) { return Math.max(...hitCircles(0, 0, rot).map(c => c.y + c.r / cur.shrink)); }

  /* ------------------------------------------------------------------
     ACTIONS
     ------------------------------------------------------------------ */
  function flap() {
    bird.vy = CFG.flap;
    bird.squash = 1;
    Sfx.flap();
    for (let i = 0; i < 3; i++) particles.push({ t: 'puff', x: bird.x - cur.w * 0.45, y: bird.y + 6 + (Math.random() * 10 - 5), vx: -60 - Math.random() * 60, vy: 30 + Math.random() * 40, life: 0.35, max: 0.35, size: 4 + Math.random() * 4 });
  }

  function showScreen(name) {
    for (const s of screens) $('#' + s).classList.toggle('show', s === name);
    const tabs = name === 'menu' || name === 'birds';
    el.tabbar.classList.toggle('show', tabs);
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  }
  function setHud(visible) { el.hud.classList.toggle('hidden', !visible); }

  function goMenu() {
    S.state = 'menu'; S.paused = false;
    S.pipes.length = 0; particles.length = 0; popups.length = 0;
    bird.targetX = W / 2; bird.vy = 0; bird.rot = 0;
    el.menuBest.textContent = best;
    setHud(false); showScreen('menu');
    updateTabIcon();
  }

  function goBirds() {
    if (S.state === 'birds') return;
    S.state = 'birds';
    S.pipes.length = 0; particles.length = 0; popups.length = 0;
    setHud(false); renderBirds(); showScreen('birds');
  }

  function starsHTML(n) { return '<span class="on">' + '★'.repeat(n) + '</span>' + '★'.repeat(3 - n); }
  function renderBirds() {
    const owned = BIRDS.filter(b => images[b.id]);
    const total = BIRDS.length + COMING_SOON;
    $('#birdsCount').textContent = owned.length + ' / ' + total;
    $('#colCount').textContent = owned.length + ' / ' + total;
    let html = '';
    for (const b of BIRDS) {
      const img = images[b.id];
      if (!img) continue;

      html += `<button class="bird-card${eq ? ' equipped' : ''}" data-id="${b.id}" aria-pressed="${eq}" aria-label="${b.name}${eq ? ', équipé' : ', équiper'}">
        ${eq ? '<span class="eq-tag">ÉQUIPÉ</span>' : ''}
        <span class="bc-img"><img src="${img.src}" alt=""></span>
        <span class="bc-name">${b.name.toUpperCase()}</span>
        <span class="bc-rar">${b.rarity}</span>
        <span class="bc-stars">${starsHTML(b.stars)}</span>
      </button>`;
    }
    for (let i = 0; i < COMING_SOON; i++) {
      html += `<div class="bird-card locked" aria-label="Personnage à venir"><span class="bc-img"><span class="lock-q">?</span></span><span class="bc-name">???</span><span class="bc-rar">Bientôt</span></div>`;
    }
    el.birdGrid.innerHTML = html;
  }
  function equip(id) {
    const b = BIRDS.find(x => x.id === id);
    if (!b || !images[id]) return;
    if (b === cur) { Sfx.click(); return; }
    cur = b; store.set('bird', id);
    buildBirdSprite(); updateTabIcon(); renderBirds();
    Sfx.score();
    const card = el.birdGrid.querySelector(`[data-id="${id}"]`);
    if (card) card.classList.add('pop');
  }
  function updateTabIcon() { if (images[cur.id]) el.tabBirdImg.src = images[cur.id].src; }

  function goReady() {
    S.state = 'ready';
    S.score = 0; el.score.textContent = '0';
    S.pipes.length = 0; particles.length = 0; popups.length = 0;
    S.landed = false; S.newRecord = false;
    bird.targetX = W * 0.3; bird.vy = 0; bird.rot = 0; bird.prot = 0;
    if (bird.y > 420 || bird.y < 200) { bird.y = bird.py = 330; }
    setHud(true); $('#btnPause').style.visibility = 'hidden';
    showScreen('ready');
  }

  function startPlay() {
    S.state = 'play';
    bird.x = bird.targetX = W * 0.3;
    S.nextPipeWX = S.worldX + W + 140;
    S.lastGapY = (CFG.topMargin + GROUND_Y - CFG.bottomMargin) / 2;
    $('#btnPause').style.visibility = 'visible';
    showScreen(null);
    flap();
  }

  function die(cause) {
    if (S.state !== 'play') return;
    S.state = 'dying'; S.deadT = 0; S.landed = cause === 'ground';
    S.shake = 11;
    el.flash.classList.remove('go'); void el.flash.offsetWidth; el.flash.classList.add('go');
    Sfx.hit();
    if (!S.landed) { Sfx.fall(); bird.vy = Math.min(bird.vy, -120); }
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    const cols = ['#c9b49c', '#a7907a', '#e4d6c2', '#8c7660'];
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 200;
      particles.push({ t: 'feather', x: bird.x, y: bird.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 1.2 + Math.random() * 0.5, max: 1.7, size: 5 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 10, c: cols[i % 4] });
    }
    if (S.score > best) { best = S.score; S.newRecord = true; store.set('best', best); }
    $('#btnPause').style.visibility = 'hidden';
  }

  function medalFor(score) { return MEDALS.find(m => score >= m.min) || null; }
  function medalSVG(id) {
    const P = {
      or: ['#fff6b8', '#f7c81e', '#b37f08', '#e8402a'],
      argent: ['#ffffff', '#cdd5de', '#7b8794', '#2f7fd8'],
      bronze: ['#ffd9b0', '#d9823d', '#8a4a1a', '#3f9d4a']
    }[id];
    if (!P) return `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="38" fill="#f1e2bd" stroke="#d4b67a" stroke-width="5" stroke-dasharray="9 7"/><text x="50" y="66" text-anchor="middle" font-family="Lilita One, Arial Black, sans-serif" font-size="40" fill="#d4b67a">?</text></svg>`;
    return `<svg viewBox="0 0 100 100">
      <defs><radialGradient id="mg-${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${P[0]}"/><stop offset=".55" stop-color="${P[1]}"/><stop offset="1" stop-color="${P[2]}"/></radialGradient></defs>
      <path d="M30 4h14l8 22-12 6zM70 4H56l-8 22 12 6z" fill="${P[3]}" stroke="#3b2414" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="50" cy="58" r="36" fill="url(#mg-${id})" stroke="#3b2414" stroke-width="4"/>
      <circle cx="50" cy="58" r="27" fill="none" stroke="${P[2]}" stroke-width="2.5" opacity=".6"/>
      <path d="M50 38l5.9 12 13.2 1.9-9.6 9.3 2.3 13.1L50 68.1l-11.8 6.2 2.3-13.1-9.6-9.3 13.2-1.9z" fill="${P[0]}" stroke="${P[2]}" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="37" cy="40" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-35 37 40)"/>
    </svg>`;
  }

  function showOver() {
    S.state = 'over'; S.overT = 0;
    setHud(false);
    const m = medalFor(S.score);
    el.medal.innerHTML = medalSVG(m ? m.id : null);
    el.medal.classList.toggle('won', !!m);
    el.medalName.textContent = m ? m.name : 'AUCUNE';
    const next = MEDALS.slice().reverse().find(x => S.score < x.min);
    el.nextMedal.textContent = next ? `Encore ${next.min - S.score} pt${next.min - S.score > 1 ? 's' : ''} pour la médaille ${next.name.toLowerCase()} !` : 'Médaille d’or — chapeau, le coq !';
    el.overBest.textContent = best;
    el.newBadge.classList.toggle('on', S.newRecord);
    el.overScore.textContent = '0';
    showScreen('over');
    // le score défile jusqu'à sa valeur
    const target = S.score, t0 = performance.now(), dur = Math.min(900, 150 + target * 25);
    (function tick(now) {
      const p = Math.min(1, (now - t0) / dur);
      el.overScore.textContent = Math.round(target * p);
      if (p < 1 && S.state === 'over') requestAnimationFrame(tick);
    })(t0);
    if (m) setTimeout(() => { if (S.state === 'over') Sfx.medal(); }, 450);
  }

  function pause() {
    if (S.state !== 'play') return;
    S.state = 'paused';
    Sfx.click();
    showScreen('pause');
  }
  function resume() {
    if (S.state !== 'paused') return;
    S.state = 'countdown'; S.countdown = 3; S.countShown = 0;
    showScreen('countdown');
  }

  function action() {
    switch (S.state) {
      case 'menu': Sfx.click(); goReady(); break;
      case 'birds': break;
      case 'ready': startPlay(); break;
      case 'play': flap(); break;
    }
  }

  function setTheme(n) {
    night = n; store.set('night', night); updateToggles();
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = night ? '#0d1a3e' : '#4ec0f0';
  }
  function setMuted(m) { Sfx.setMuted(m); store.set('muted', m); updateToggles(); }
  const ICON = {
    on: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#3b2414" stroke-width="2.2" stroke-linecap="round"/></svg>',
    off: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="#3b2414" stroke-width="2.4" stroke-linecap="round"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><g stroke="#3b2414" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
  };
  function updateToggles() {
    $$('.js-sound').forEach(b => { b.innerHTML = Sfx.isMuted() ? ICON.off : ICON.on; b.setAttribute('aria-label', Sfx.isMuted() ? 'Activer le son' : 'Couper le son'); });
    $$('.js-theme').forEach(b => { b.innerHTML = night ? ICON.moon : ICON.sun; b.setAttribute('aria-label', night ? 'Passer en mode jour' : 'Passer en mode nuit'); });
  }

  async function share() {
    const pts = `${S.score} point${S.score > 1 ? 's' : ''}`;
    const text = `J'ai marqué ${pts} sur FLAPPY COQ 🐓 (record : ${best}). Tu fais mieux ?`;
    const url = /^https?:/.test(location.href) ? location.href : undefined;
    if (navigator.share) {
      try { await navigator.share({ title: 'Flappy Coq', text, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url ? `${text} ${url}` : text); toast('Score copié — colle-le où tu veux !'); }
    catch (e) { toast('Partage indisponible sur cet appareil'); }
  }

  /* ------------------------------------------------------------------
     MISE À JOUR (pas fixe)
     ------------------------------------------------------------------ */
  function step(dt) {
    S.t += dt;
    bird.py = bird.y; bird.prot = bird.rot; S.prevWorldX = S.worldX;

    // vitesse du décor selon l'état
    const st = S.state;
    const target = st === 'play' ? curSpeed() : (st === 'dying' || st === 'over') ? 0 : CFG.menuSpeed;
    S.speed = st === 'play' ? target : lerp(S.speed, target, Math.min(1, dt * 6));
    S.worldX += S.speed * dt;

    bird.x += (bird.targetX - bird.x) * Math.min(1, dt * 7);
    bird.squash = Math.max(0, bird.squash - dt * 6);

    if (st === 'menu' || st === 'loading' || st === 'birds') {
      bird.y = 345 + Math.sin(S.t * 2.6) * 12;
      bird.rot = Math.sin(S.t * 2.0) * 0.07;
    } else if (st === 'ready') {
      bird.y += (330 + Math.sin(S.t * 4.2) * 9 - bird.y) * Math.min(1, dt * 8);
      bird.rot += (0 - bird.rot) * Math.min(1, dt * 8);
    } else if (st === 'play') {
      bird.vy = Math.min(bird.vy + CFG.gravity * dt, CFG.maxFall);
      bird.y += bird.vy * dt;
      if (bird.y < -60) { bird.y = -60; bird.vy = Math.max(bird.vy, 0); }
      // rotation : nez vers le haut au saut, piqué progressif en chute
      if (bird.vy < 170) bird.rot += (-0.42 - bird.rot) * Math.min(1, dt * 18);
      else bird.rot = Math.min(1.2, bird.rot + 3.6 * dt);

      // obstacles
      while (S.nextPipeWX - S.worldX < W + 60) spawnPipe();
      const circles = hitCircles(bird.x, bird.y, bird.rot);
      for (const c of circles) if (c.y + c.r >= GROUND_Y) { die('ground'); break; }
      if (S.state === 'play') {
        for (const p of S.pipes) {
          const sx = p.wx - S.worldX;
          if (sx > bird.x + 60 || sx + CFG.pipeW < bird.x - 60) {
            // hors de portée de collision
          } else {
            const rects = pipeRects(p, sx);
            if (circles.some(c => rects.some(r => circleRect(c.x, c.y, c.r, r[0], r[1], r[2], r[3])))) { die('pipe'); break; }
          }
          if (!p.scored && sx + CFG.pipeW / 2 < bird.x) { p.scored = true; scorePoint(p, sx); }
        }
      }
      S.pipes = S.pipes.filter(p => p.wx - S.worldX > -CFG.pipeW - 20);
    } else if (st === 'dying' || st === 'over') {
      S.deadT += dt;
      if (!S.landed) {
        bird.vy = Math.min(bird.vy + CFG.gravity * 1.1 * dt, CFG.maxFall * 1.2);
        bird.y += bird.vy * dt;
        bird.rot = Math.min(1.55, bird.rot + 5 * dt);
        const ext = bottomExtent(bird.rot);
        if (bird.y + ext >= GROUND_Y) { bird.y = GROUND_Y - ext; S.landed = true; S.shake = Math.max(S.shake, 5); }
      } else {
        bird.rot = Math.min(1.55, bird.rot + 5 * dt);
        bird.y = Math.min(bird.y, GROUND_Y - bottomExtent(bird.rot));
      }
      if (st === 'dying' && S.landed && S.deadT > 0.45) showOver();
      if (st === 'over') S.overT += dt;
    }

    // particules
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t === 'feather') { p.vy += 380 * dt; p.vx *= (1 - dt * 1.5); p.rot += p.vr * dt; if (p.y > GROUND_Y - 3) { p.y = GROUND_Y - 3; p.vy = 0; p.vx = 0; p.vr = 0; } }
      else if (p.t === 'spark') { p.vy += 260 * dt; p.vx -= S.speed * dt * 0.6; p.rot += 8 * dt; }
      else if (p.t === 'ring') { p.size += 160 * dt; p.x -= S.speed * dt; }
    }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.life -= dt; p.y -= 55 * dt; if (p.life <= 0) popups.splice(i, 1); }

    S.shake = Math.max(0, S.shake - dt * 40);
    const tm = night ? 1 : 0;
    themeMix += clamp(tm - themeMix, -dt * 2, dt * 2);
  }

  function scorePoint(p, sx) {
    S.score++;
    el.score.textContent = S.score;
    el.score.classList.remove('bump'); void el.score.offsetWidth; el.score.classList.add('bump');
    Sfx.score();
    const cx = sx + CFG.pipeW / 2;
    particles.push({ t: 'ring', x: cx, y: p.gapY, vx: 0, vy: 0, life: 0.4, max: 0.4, size: 10 });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 170;
      particles.push({ t: 'spark', x: cx, y: p.gapY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.35, max: 0.85, size: 3 + Math.random() * 4, rot: Math.random() * 3, c: i % 3 ? '#ffe066' : '#ffffff' });
    }
    popups.push({ x: bird.x + 26, y: bird.y - 26, life: 0.7, max: 0.7, text: '+1' });
  }

  /* ------------------------------------------------------------------
     RENDU
     ------------------------------------------------------------------ */
  function drawTiled(layer, offset, y, alpha) {
    if (alpha <= 0) return;
    const tw = layer.w;
    let x0 = -(((offset % tw) + tw) % tw);
    x0 = Math.round(x0 * k) / k;
    ctx.globalAlpha = alpha;
    for (let x = x0; x < W; x += tw) ctx.drawImage(layer.c, x, y, tw, layer.h);
    ctx.globalAlpha = 1;
  }
  function drawLayer(name, offset, y) {
    const m = themeMix;
    if (m < 1) drawTiled(L.day[name], offset, y, 1);
    if (m > 0) drawTiled(L.night[name], offset, y, m);
  }

  function drawSky() {
    const m = themeMix;
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, mix('#3fb4ec', '#0a1636', m));
    g.addColorStop(0.65, mix('#8fd6f3', '#26346e', m));
    g.addColorStop(1, mix('#cdeffa', '#4c4f8f', m));
    ctx.fillStyle = g;
    ctx.fillRect(-30, -30, W + 60, VH + 60);

    // étoiles
    if (m > 0.02) {
      for (const s of stars) {
        const a = m * (0.55 + 0.45 * Math.sin(S.t * 2 + s.p));
        ctx.globalAlpha = a; ctx.fillStyle = '#fff';
        ctx.fillRect(s.x * W, s.y * VH, s.s, s.s);
      }
      ctx.globalAlpha = 1;
    }
    // soleil / lune
    const cx = W * 0.78, cy = 105;
    if (m < 1) {
      ctx.globalAlpha = 1 - m;
      const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, 90);
      gl.addColorStop(0, 'rgba(255,248,200,.85)'); gl.addColorStop(1, 'rgba(255,248,200,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, 90, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff6c4'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
    }
    if (m > 0) {
      ctx.globalAlpha = m;
      const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, 80);
      gl.addColorStop(0, 'rgba(220,230,255,.45)'); gl.addColorStop(1, 'rgba(220,230,255,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, 80, 0, 7); ctx.fill();
      ctx.fillStyle = '#f2f1dc'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 7); ctx.fill();
      ctx.fillStyle = '#d9d6b8';
      [[-8, -6, 6], [9, 5, 5], [-4, 11, 3.5], [6, -12, 3]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(cx + x, cy + y, r, 0, 7); ctx.fill(); });
    }
    ctx.globalAlpha = 1;
  }

  function drawClouds(wx) {
    const span = W + 340;
    for (const c of clouds) {
      const off = wx * (0.08 + c.v * 0.06) + S.t * (6 + c.v * 8);
      const x = (((c.x - off) % span) + span) % span - 170;
      const w = 160 * c.s, h = 90 * c.s;
      if (themeMix < 1) { ctx.globalAlpha = 0.95; ctx.drawImage(L.day.cloud.c, x, c.y, w, h); }
      if (themeMix > 0) { ctx.globalAlpha = themeMix * 0.9; ctx.drawImage(L.night.cloud.c, x, c.y, w, h); }
    }
    ctx.globalAlpha = 1;
  }

  let pipeGrad = null, capGrad = null, gradK = 0;
  function pipeGradients() {
    if (gradK === k && pipeGrad) return;
    gradK = k;
    const stops = [[0, '#4e9a1f'], [0.08, '#8fdc4f'], [0.22, '#b4f06f'], [0.38, '#86d443'], [0.75, '#5fae27'], [0.92, '#4a8f1c'], [1, '#3d7c15']];
    pipeGrad = ctx.createLinearGradient(0, 0, CFG.pipeW, 0);
    stops.forEach(([o, c]) => pipeGrad.addColorStop(o, c));
    capGrad = ctx.createLinearGradient(-CFG.capOver, 0, CFG.pipeW + CFG.capOver, 0);
    stops.forEach(([o, c]) => capGrad.addColorStop(o, c));
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function drawPipes(wx) {
    pipeGradients();
    const pw = CFG.pipeW, o = CFG.capOver, ch = CFG.capH;
    ctx.lineWidth = 3; ctx.strokeStyle = '#2b5212'; ctx.lineJoin = 'round';
    for (const p of S.pipes) {
      const sx = p.wx - wx;
      if (sx > W + 20 || sx + pw < -20) continue;
      const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
      ctx.save();
      ctx.translate(Math.round(sx * k) / k, 0);
      // corps
      ctx.fillStyle = pipeGrad;
      ctx.fillRect(0, -10, pw, top - ch + 10); ctx.strokeRect(0, -10, pw, top - ch + 10);
      ctx.fillRect(0, bot + ch, pw, GROUND_Y - bot - ch + 4); ctx.strokeRect(0, bot + ch, pw, GROUND_Y - bot - ch + 4);
      // ombre sous les chapeaux
      ctx.fillStyle = 'rgba(30,60,10,.28)';
      ctx.fillRect(1.5, top - ch - 7, pw - 3, 7);
      ctx.fillRect(1.5, bot + ch, pw - 3, 7);
      // chapeaux
      ctx.fillStyle = capGrad;
      roundRect(-o, top - ch, pw + o * 2, ch, 4); ctx.fill(); ctx.stroke();
      roundRect(-o, bot, pw + o * 2, ch, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(-o + 4, top - ch + 4, pw + o * 2 - 8, 3);
      ctx.fillRect(-o + 4, bot + 4, pw + o * 2 - 8, 3);
      ctx.restore();
    }
    if (themeMix > 0) {   // les tuyaux s'assombrissent la nuit
      ctx.fillStyle = `rgba(12,22,60,${0.32 * themeMix})`;
      for (const p of S.pipes) {
        const sx = p.wx - wx; if (sx > W + 20 || sx + pw < -20) continue;
        ctx.fillRect(sx - o - 2, -10, pw + o * 2 + 4, GROUND_Y + 10);
      }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.t === 'puff') {
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - a * 0.4), 0, 7); ctx.fill();
      } else if (p.t === 'spark') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
        const s = p.size; ctx.beginPath(); ctx.moveTo(0, -s * 1.6); ctx.lineTo(s * .45, -s * .45); ctx.lineTo(s * 1.6, 0); ctx.lineTo(s * .45, s * .45);
        ctx.lineTo(0, s * 1.6); ctx.lineTo(-s * .45, s * .45); ctx.lineTo(-s * 1.6, 0); ctx.lineTo(-s * .45, -s * .45); ctx.closePath(); ctx.fill(); ctx.restore();
      } else if (p.t === 'ring') {
        ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = 4 * a; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke();
      } else if (p.t === 'feather') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.strokeStyle = '#3b2414'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.5, p.size * 0.55, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawBird(a) {
    if (!birdSprite || S.state === 'birds') return;
    const y = lerp(bird.py, bird.y, a), rot = lerp(bird.prot, bird.rot, a);
    const sq = bird.squash;
    let sx = 1 + 0.10 * sq, sy = 1 - 0.13 * sq;
    if (S.state === 'play' && bird.vy < 0) sy += Math.sin(S.t * 38) * 0.025;   // frémissement en montée
    const bw = cur.w, bh = birdH();
    // ombre portée sur le sol
    const dist = clamp((GROUND_Y - y) / 400, 0, 1);
    ctx.globalAlpha = 0.18 * (1 - dist * 0.7);
    ctx.fillStyle = '#2a3a10';
    ctx.beginPath(); ctx.ellipse(bird.x, GROUND_Y + 6, bw * 0.42 * (1 - dist * 0.5), 5, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(bird.x, y);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.drawImage(birdSprite, -bw / 2, -bh / 2, bw, bh);
    ctx.restore();
  }

  function drawPopups() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '28px "Lilita One", "Arial Black", sans-serif';
    ctx.lineJoin = 'round';
    for (const p of popups) {
      const a = clamp(p.life / p.max * 1.6, 0, 1);
      ctx.globalAlpha = a;
      ctx.lineWidth = 6; ctx.strokeStyle = '#3b2414'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = '#ffe066'; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawHitbox() {
    ctx.strokeStyle = 'rgba(255,0,80,.9)'; ctx.lineWidth = 1.5;
    for (const c of hitCircles(bird.x, bird.y, bird.rot)) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(0,80,255,.9)';
    for (const p of S.pipes) for (const r of pipeRects(p, p.wx - S.worldX)) ctx.strokeRect(r[0], r[1], r[2], r[3]);
  }

  function render(a) {
    if (!L.day) return;
    const wx = lerp(S.prevWorldX, S.worldX, a);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if (S.shake > 0.2) ctx.translate((Math.random() * 2 - 1) * S.shake, (Math.random() * 2 - 1) * S.shake);
    drawSky();
    drawClouds(wx);
    drawLayer('city', wx * 0.2, CITY_Y);
    drawLayer('bush', wx * 0.45, BUSH_Y);
    drawPipes(wx);
    drawLayer('ground', wx, GROUND_Y);
    ctx.fillStyle = mix('#e2d593', '#8b8470', themeMix);   // bas du sol (au-delà de la tuile, si l'écran est plus haut)
    ctx.fillRect(-30, GROUND_Y + 99.5, W + 60, 60);
    drawParticles();
    drawBird(a);
    drawPopups();
    if (S.showHit) drawHitbox();
  }

  /* ------------------------------------------------------------------
     BOUCLE PRINCIPALE : requestAnimationFrame + delta time + accumulateur
     ------------------------------------------------------------------ */
  let last = 0, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = last ? (now - last) / 1000 : 0;
    last = now;
    if (dt > 0.1) dt = 0.1;   // onglet en arrière-plan : on évite le « saut » de physique

    if (S.state === 'countdown') {
      S.countdown -= dt;
      const n = Math.ceil(S.countdown);
      if (n !== S.countShown && n > 0) {
        S.countShown = n; el.countNum.textContent = n; Sfx.count();
        el.countNum.classList.remove('pop'); void el.countNum.offsetWidth; el.countNum.classList.add('pop');
      }
      if (S.countdown <= 0) { S.state = 'play'; bird.vy = Math.min(bird.vy, 0); showScreen(null); }
    }
    if (S.state !== 'paused' && S.state !== 'countdown') {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 20) { step(STEP); acc -= STEP; n++; }
    } else {
      themeMix += clamp((night ? 1 : 0) - themeMix, -dt * 2, dt * 2);
    }
    render(S.state === 'paused' || S.state === 'countdown' ? 1 : acc / STEP);
  }

  /* ------------------------------------------------------------------
     ENTRÉES : souris, tactile, clavier — sans double déclenchement
     ------------------------------------------------------------------ */
  function isUI(t) { return t && t.closest && t.closest('button, a, .bird-grid'); }

  stage.addEventListener('pointerdown', e => {
    if (isUI(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    Sfx.unlock();
    action();
  });
  // bloque le défilement, le zoom et les clics « fantômes » sur mobile (sauf sur les boutons)
  stage.addEventListener('touchstart', e => { if (!isUI(e.target)) e.preventDefault(); }, { passive: false });
  stage.addEventListener('touchmove', e => { if (!e.target.closest('.bird-grid')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (stage.contains(e.target)) e.preventDefault(); });

  window.addEventListener('keydown', e => {
    const code = e.code;
    if (['Space', 'ArrowUp', 'KeyW'].includes(code)) {
      e.preventDefault();
      if (e.repeat) return;                 // maintien de touche ≠ sauts multiples
      Sfx.unlock();
      if (S.state === 'over') { if (S.overT > 0.6) { Sfx.click(); goReady(); } return; }
      if (S.state === 'paused') { resume(); return; }
      action();
    } else if (code === 'Enter') {
      if (S.state === 'menu') { Sfx.unlock(); action(); }
      else if (S.state === 'over' && S.overT > 0.6) { Sfx.click(); goReady(); }
    } else if (S.state === 'birds' && (code === 'Escape' || code === 'Backspace')) {
      goMenu();
    } else if (code === 'KeyP' || code === 'Escape') {
      if (S.state === 'play') pause(); else if (S.state === 'paused') resume();
    } else if (code === 'KeyM') { Sfx.unlock(); setMuted(!Sfx.isMuted()); }
    else if (code === 'KeyN') setTheme(!night);
    else if (code === 'KeyH') S.showHit = !S.showHit;   // affiche les hitbox (débogage)
  });

  function onBtn(sel, fn) {
    $$(sel).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); Sfx.unlock(); fn(e); b.blur(); }));
  }
  onBtn('#btnPlay', () => { Sfx.click(); goReady(); });
  onBtn('#btnBirdsPlay', () => { Sfx.click(); goReady(); });
  onBtn('.tab', e => { const t = e.currentTarget.dataset.tab; if (t === S.state) return; Sfx.click(); t === 'birds' ? goBirds() : goMenu(); });
  el.birdGrid.addEventListener('click', e => { const c = e.target.closest('.bird-card[data-id]'); if (c) { e.stopPropagation(); Sfx.unlock(); equip(c.dataset.id); } });
  onBtn('#btnPause', () => pause());
  onBtn('#btnResume', () => { Sfx.click(); resume(); });
  onBtn('#btnPauseHome', () => { Sfx.click(); goMenu(); });
  onBtn('#btnReplay', () => { Sfx.click(); goReady(); });
  onBtn('#btnHome', () => { Sfx.click(); goMenu(); });
  onBtn('#btnShare', () => { Sfx.click(); share(); });
  onBtn('.js-sound', () => { setMuted(!Sfx.isMuted()); Sfx.click(); });
  onBtn('.js-theme', () => { Sfx.click(); setTheme(!night); });

  document.addEventListener('visibilitychange', () => { if (document.hidden && S.state === 'play') pause(); last = 0; });
  window.addEventListener('blur', () => { if (S.state === 'play') pause(); });
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  window.addEventListener('pageshow', () => setTimeout(resize, 50));
  setTimeout(resize, 350);   // iOS (appli sur l'écran d'accueil) donne parfois la bonne taille d'écran un peu après le lancement

  /* ------------------------------------------------------------------
     DÉMARRAGE
     ------------------------------------------------------------------ */
  updateToggles();
  setTheme(night);
  resize();
  requestAnimationFrame(frame);

  Promise.all([loadAllBirds(), loadFonts()])
    .then(() => {
      buildBirdSprite();
      bird.x = bird.targetX = W / 2;
      goMenu();
    })
    .catch(err => {
      console.error(err);
      el.loading.classList.add('error');
      el.loadingText.innerHTML = 'Impossible de charger le personnage.<br>Place les fichiers <b>personnage.png</b> et <b>super-coq.png</b> dans le dossier <b>assets/</b> à côté de <b>index.html</b>, puis recharge la page.';
    });

  // Web app : fonctionnement hors-ligne une fois installée (uniquement en http/https)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.FC_NO_SW) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Mode hors-ligne indisponible :', e)));
  }

  // accès pour les tests automatisés
  window.__flappy = { S, bird, CFG, hitCircles, equip, get cur() { return cur; }, get best() { return best; }, flap: () => action() };
})();

</script>
</body>
</html>
